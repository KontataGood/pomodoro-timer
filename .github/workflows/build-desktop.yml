name: Build Desktop Apps

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller pytest
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
      - name: Build executable
        run: >-
          python -m PyInstaller --noconfirm --clean --onedir --windowed
          --name PomodoroTimer main.py

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: PomodoroTimer-Windows
          path: dist/PomodoroTimer/
          if-no-files-found: error
          retention-days: 14


  build-macos:
    name: Build macOS App
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller pytest
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      - name: Build macOS app bundle
        run: >-
          python -m PyInstaller --noconfirm --clean --windowed
          --name PomodoroTimer main.py

      - name: Package macOS app
        run: ditto -c -k --sequesterRsrc --keepParent dist/PomodoroTimer.app PomodoroTimer-macOS.zip
      - name: Upload macOS app artifact
        uses: actions/upload-artifact@v4
        with:
          name: PomodoroTimer-macOS
          path: PomodoroTimer-macOS.zip
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: PomodoroTimer-Windows
          path: release/windows
      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: PomodoroTimer-macOS
          path: release/macos
      - name: Package Windows app
        run: cd release/windows && zip -r ../../PomodoroTimer-Windows.zip PomodoroTimer

      - name: Create GitHub Release and attach builds
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            PomodoroTimer-Windows.zip
            release/macos/PomodoroTimer-macOS.zip
